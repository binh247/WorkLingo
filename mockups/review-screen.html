<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkLingo — Demo màn ôn tập</title>

  <!-- Tailwind (CDN cho demo) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Fonts: Nunito (UI) + Noto Sans JP (tiếng Nhật) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Nunito', 'sans-serif'],
            jp: ['"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            brand: { DEFAULT: '#58CC02', dark: '#46A302' },
            danger: { DEFAULT: '#FF4B4B', dark: '#E04343' },
            xp: '#FFC800',
            info: { DEFAULT: '#1CB0F6', dark: '#1799D6' },
            ink: '#3C3C3C',
            muted: '#AFAFAF',
          },
        },
      },
    };
  </script>

  <style>
    body { background: #fff; color: #3C3C3C; }
    /* Nút 3D kiểu Duolingo */
    .btn-3d {
      border-bottom-width: 4px;
      transition: all .08s ease;
    }
    .btn-3d:active { border-bottom-width: 0; transform: translateY(4px); }
    /* Furigana (ruby) */
    ruby rt { font-size: .55em; color: #777; font-weight: 700; }
    .bounce-in { animation: bounceIn .35s ease; }
    @keyframes bounceIn {
      0% { transform: scale(.85); opacity: 0; }
      60% { transform: scale(1.04); }
      100% { transform: scale(1); opacity: 1; }
    }
    .shake { animation: shake .35s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>

<body class="font-sans min-h-screen flex flex-col">

  <!-- ===== Header: nút thoát + progress + streak/XP/hearts ===== -->
  <header class="max-w-2xl w-full mx-auto px-4 pt-5 pb-2 flex items-center gap-4">
    <button class="text-muted hover:text-ink text-3xl font-black leading-none">×</button>

    <!-- Progress bar -->
    <div class="flex-1 h-4 bg-gray-200 rounded-full overflow-hidden">
      <div id="progress" class="h-full bg-brand rounded-full transition-all duration-500" style="width: 40%"></div>
    </div>

    <!-- Streak -->
    <div class="flex items-center gap-1 font-extrabold text-orange-500">
      <span class="text-xl">🔥</span><span>7</span>
    </div>
    <!-- XP -->
    <div class="flex items-center gap-1 font-extrabold text-xp">
      <span class="text-xl">⭐</span><span id="xp">120</span>
    </div>
    <!-- Hearts -->
    <div class="flex items-center gap-1 font-extrabold text-danger">
      <span class="text-xl">❤️</span><span>5</span>
    </div>
  </header>

  <!-- ===== Nội dung câu hỏi ===== -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 flex flex-col">
    <div class="mt-8">
      <p class="text-2xl md:text-3xl font-extrabold text-ink">Chọn nghĩa của từ được tô màu</p>

      <!-- Nhãn nguồn (đặc trưng WorkLingo) -->
      <div class="mt-3 inline-flex items-center gap-2 bg-info/10 text-info font-bold text-sm px-3 py-1 rounded-full">
        💬 Từ chat công việc · Slack #team-dev
      </div>

      <!-- Câu tiếng Nhật + furigana, từ đích được highlight -->
      <div class="mt-6 bg-gray-50 border-2 border-gray-200 rounded-2xl p-6">
        <p class="font-jp text-2xl md:text-3xl leading-relaxed text-ink">
          <ruby>明日<rt>あした</rt></ruby>までに
          <span class="bg-brand/20 text-brand-dark rounded-lg px-1">
            <ruby>確認<rt>かくにん</rt></ruby>
          </span>
          をお<ruby>願<rt>ねが</rt></ruby>いします。
        </p>
        <button class="mt-3 text-info font-bold text-sm flex items-center gap-1">
          🔊 Nghe phát âm
        </button>
      </div>
    </div>

    <!-- Lựa chọn đáp án -->
    <div id="choices" class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
      <!-- nút đáp án sinh bằng JS -->
    </div>
  </main>

  <!-- ===== Thanh feedback + nút Kiểm tra (dính đáy) ===== -->
  <footer id="footer" class="border-t-2 border-gray-200 transition-colors">
    <div class="max-w-2xl w-full mx-auto px-4 py-5 flex items-center justify-between gap-4">
      <div id="feedback" class="font-extrabold text-lg hidden items-center gap-2"></div>
      <div class="flex-1"></div>
      <button id="checkBtn"
        class="btn-3d bg-brand border-brand-dark text-white font-extrabold tracking-wide
               rounded-2xl px-10 py-4 text-lg disabled:bg-gray-200 disabled:border-gray-300
               disabled:text-gray-400 disabled:cursor-not-allowed">
        KIỂM TRA
      </button>
    </div>
  </footer>

  <script>
    const ANSWERS = [
      { text: 'xác nhận', correct: true },
      { text: 'liên lạc', correct: false },
      { text: 'chuẩn bị', correct: false },
      { text: 'báo cáo', correct: false },
    ];

    let selected = null;
    let answered = false;
    const choicesEl = document.getElementById('choices');
    const checkBtn = document.getElementById('checkBtn');
    const footer = document.getElementById('footer');
    const feedback = document.getElementById('feedback');

    function renderChoices() {
      choicesEl.innerHTML = '';
      ANSWERS.forEach((a, i) => {
        const btn = document.createElement('button');
        btn.className =
          'btn-3d choice bg-white border-2 border-b-4 border-gray-200 ' +
          'rounded-2xl px-4 py-4 text-left font-bold text-ink text-lg ' +
          'hover:bg-gray-50';
        btn.innerHTML =
          `<span class="inline-flex items-center justify-center w-7 h-7 mr-3 ` +
          `rounded-lg border-2 border-gray-200 text-muted text-sm">${i + 1}</span>` +
          a.text;
        btn.onclick = () => selectChoice(i, btn);
        choicesEl.appendChild(btn);
      });
    }

    function selectChoice(i, btn) {
      if (answered) return;
      selected = i;
      document.querySelectorAll('.choice').forEach((b) => {
        b.classList.remove('border-info', 'bg-info/10');
        b.classList.add('border-gray-200');
      });
      btn.classList.remove('border-gray-200');
      btn.classList.add('border-info', 'bg-info/10');
      checkBtn.disabled = false;
    }

    function check() {
      if (selected === null && !answered) return;

      // Trạng thái "Tiếp tục" sau khi đã trả lời
      if (answered) return next();

      answered = true;
      const isCorrect = ANSWERS[selected].correct;
      feedback.classList.remove('hidden');
      feedback.classList.add('flex', 'bounce-in');

      if (isCorrect) {
        footer.classList.add('bg-brand/10', 'border-brand');
        feedback.classList.add('text-brand-dark');
        feedback.innerHTML = '✓ Chính xác! <span class="text-xp">+10 XP</span>';
        checkBtn.className = checkBtn.className.replace(/bg-brand|border-brand-dark/g, '') +
          ' bg-brand border-brand-dark';
        // XP + confetti
        const xpEl = document.getElementById('xp');
        xpEl.textContent = parseInt(xpEl.textContent) + 10;
        document.getElementById('progress').style.width = '60%';
        confetti({ particleCount: 120, spread: 70, origin: { y: 0.7 },
                   colors: ['#58CC02', '#FFC800', '#1CB0F6'] });
      } else {
        footer.classList.add('bg-danger/10', 'border-danger');
        feedback.classList.add('text-danger');
        feedback.innerHTML = '✕ Đáp án đúng: <span class="underline">xác nhận</span>';
        document.querySelector('main').classList.add('shake');
      }

      // tô màu đáp án
      document.querySelectorAll('.choice').forEach((b, i) => {
        b.classList.add('pointer-events-none');
        if (ANSWERS[i].correct) { b.classList.add('border-brand', 'bg-brand/10', 'text-brand-dark'); }
        else if (i === selected) { b.classList.add('border-danger', 'bg-danger/10', 'text-danger'); }
      });

      checkBtn.textContent = 'TIẾP TỤC';
    }

    function next() {
      // demo: reset về câu mới
      answered = false; selected = null;
      footer.className = 'border-t-2 border-gray-200 transition-colors';
      feedback.className = 'font-extrabold text-lg hidden items-center gap-2';
      document.querySelector('main').classList.remove('shake');
      checkBtn.textContent = 'KIỂM TRA';
      checkBtn.disabled = true;
      checkBtn.className = checkBtn.className.replace(/bg-danger|border-danger-dark/g, '');
      renderChoices();
    }

    checkBtn.onclick = check;
    checkBtn.disabled = true;
    renderChoices();

    // phím tắt 1-4 chọn, Enter kiểm tra (giống Duolingo)
    document.addEventListener('keydown', (e) => {
      if (['1','2','3','4'].includes(e.key)) {
        const btns = document.querySelectorAll('.choice');
        const idx = parseInt(e.key) - 1;
        if (btns[idx]) selectChoice(idx, btns[idx]);
      } else if (e.key === 'Enter') {
        if (!checkBtn.disabled || answered) check();
      }
    });
  </script>
</body>
</html>
