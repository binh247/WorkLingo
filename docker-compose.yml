services:
  postgres:
    image: postgres:18
    container_name: worklingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worklingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worklingo_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-worklingo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ lưu data trong subdirectory; mount tại /var/lib/postgresql
      - worklingo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worklingo} -d ${POSTGRES_DB:-worklingo}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  worklingo_pgdata:
