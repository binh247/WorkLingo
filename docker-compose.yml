services:
  postgres:
    image: postgres:18
    container_name: bloom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloom_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-bloom}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ lưu data trong subdirectory; mount tại /var/lib/postgresql
      - bloom_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloom} -d ${POSTGRES_DB:-bloom}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bloom_pgdata:
